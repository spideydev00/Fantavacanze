import java.util.Properties
import java.io.FileInputStream

plugins {
    id "com.android.application"
    // START: FlutterFire Configuration
    id 'com.google.gms.google-services'
    // END: FlutterFire Configuration
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// Definisce le variabili per caricare il file delle chiavi
def keystoreProperties = new java.util.Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new java.io.FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.spideyDev.fantavacanze"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = "28.2.13676358"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    lintOptions {
        abortOnError false
        checkReleaseBuilds false
    }

    defaultConfig {
        applicationId = "com.spideyDev.fantavacanze"
        minSdkVersion = 24
        targetSdkVersion = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        resConfigs "it", "en"
    }

    // Configurazione per la firma dell'app in release
    signingConfigs {
        create("release") {
            keyAlias = keystoreProperties['keyAlias'] as String
            keyPassword = keystoreProperties['keyPassword'] as String
            storePassword = keystoreProperties['storePassword'] as String
            // Conversione da Kotlin .let a Groovy if
            def storeFilePath = keystoreProperties['storeFile']
            if (storeFilePath != null) {
                storeFile = project.file(storeFilePath)
            }
        }
    }

    buildTypes {
        debug {
          applicationIdSuffix ".debug"
        }
        release {
            // Usa la configurazione di firma "release" per la build di release
            signingConfig = signingConfigs.getByName("release")

            // Applica le regole di Proguard/R8
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
  implementation 'com.google.android.play:integrity:1.4.0'
  implementation 'com.google.ads.mediation:applovin:13.6.3.0'
  implementation 'com.google.ads.mediation:facebook:6.21.0.3'
  implementation 'com.google.ads.mediation:mintegral:17.1.61.0'
  implementation 'com.unity3d.ads:unity-ads:4.18.1'
  implementation 'com.google.ads.mediation:unity:4.18.1.0'
  implementation 'com.google.ads.mediation:vungle:7.7.4.2'
  // Pre-integrati: vengono usati automaticamente quando li attivi su AdMob.
  implementation 'com.google.ads.mediation:ironsource:9.4.3.0'
  implementation 'com.google.ads.mediation:inmobi:11.3.0.1'
  implementation 'com.google.ads.mediation:fyber:8.4.5.1'
}

tasks.withType(JavaCompile) {
    options.compilerArgs << "-Xlint:deprecation" << "-Xlint:unchecked"
}

flutter {
    source = "../.."
}
